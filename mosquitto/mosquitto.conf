persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# file d'attente du front quand il est deconnecte (QoS 1)
max_queued_messages 10000

# nodes
listener 1883
protocol mqtt

# front (navigateur)
listener 9001
protocol websockets
